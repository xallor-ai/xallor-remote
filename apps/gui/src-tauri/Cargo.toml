[package]
name = "xallor-remote-gui"
version = "0.1.0"
description = "XallorRemote desktop"
authors = ["XallorRemote"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xallor_remote_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.6", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
