name: Build release artifacts
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  bundles:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go test ./...
      - run: npm ci
        working-directory: packages/mcp
      - run: npm run build
        working-directory: packages/mcp
      - run: npm test
        working-directory: packages/mcp
      - run: npm audit --omit=dev --audit-level=high
        working-directory: packages/mcp
      - run: python -m unittest discover -s tests -p test_release_evidence.py
      - name: Release workflow and signed lifecycle input policy
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s tests -p test_release_workflow_policy.py
          python -m unittest discover -s tests -p test_signed_lifecycle_ci.py
          python -m unittest discover -s tests -p test_signed_lifecycle_prepare.py
          python -m unittest discover -s tests -p "test_package_*.py"
          python -m unittest discover -s tests -p test_signed_package_gate.py
      - name: Signed lifecycle report and preparation failure regression
        run: python -m unittest discover -s tests -p test_signed_upgrade_report.py
      - name: Native image observations and lifecycle references
        run: |
          python -m unittest discover -s tests -p "test_runtime_image*.py"
          python -m unittest discover -s tests -p test_runtime_observation_set.py
          python -m unittest discover -s tests -p test_runtime_observer_e2e.py
          python -m unittest discover -s tests -p test_restore_evidence.py
      - run: python -m unittest discover -s tests -p test_relay_templates.py
      - run: python -m unittest discover -s tests -p test_readme_docs.py
      - run: python tests/release_source_gate_e2e.py
      - run: python scripts/build-release.py
      - run: node scripts/pack-mcp-with-runtime.mjs
      - run: python scripts/release_evidence.py
      - name: Sign artifact and SBOM provenance
        # Only a protected v* tag reaches this job. A workflow_dispatch against
        # an ordinary branch is skipped; it is not a dry-run artifact build.
        if: startsWith(github.ref, 'refs/tags/v')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/*.tgz
            dist/release/*.sha256
            dist/release/*.cdx.json
            dist/release/release-index.json
            dist/release/windows-amd64/xallor-remote.exe
            dist/release/windows-amd64/manifest.json
            dist/release/linux-amd64/xallor-remote
            dist/release/linux-amd64/manifest.json
      - name: Verify signed release and reject substitutions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_release.py --directory dist/release --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF" --revision "$GITHUB_SHA"
          python tests/release_attestation_ci.py
      - name: Preserve offline signature bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" dist/release/provenance.sigstore.json
      - name: Verify raw Runtime provenance
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist/release/linux-amd64/xallor-remote runtime verify --bundle dist/release/linux-amd64
      - name: Verify installer source gate against signed raw bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/release_install_source_e2e.py --binary dist/release/linux-amd64/xallor-remote --signed-bundle dist/release/linux-amd64
      - name: Verify signed MCP vendor launch and tamper refusal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/mcp_signed_vendor_e2e.py --signed-bundle dist/release/linux-amd64 --foreign-manifest dist/release/windows-amd64/manifest.json --package-build packages/mcp/build.json --output dist/verification/mcp-signed-vendor.json
      - name: Preserve signed vendor acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-signed-vendor-evidence
          path: |
            dist/verification/mcp-signed-vendor.json
            dist/verification/raw-attestation-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundles
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/*.tgz
            dist/release/*.json
  draft:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected
    needs: bundles
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundles
          path: dist/release
      - name: Prepare draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft --generate-notes
