name: Build release artifacts
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go test ./...
      - run: npm ci
        working-directory: packages/mcp
      - run: npm run build
        working-directory: packages/mcp
      - run: python tests/release_lifecycle.py
      - run: python scripts/build-release.py
      - run: node scripts/pack-mcp-with-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundles
          path: |
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/*.tgz
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundles
          path: dist/release
      - name: Prepare draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --draft --generate-notes
